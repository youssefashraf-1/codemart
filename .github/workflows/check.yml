name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run Jasmine tests in Chrome
        run: |
          export CHROME_BIN="$(command -v google-chrome)"
          npm run test:ci
      - run: npm run build
